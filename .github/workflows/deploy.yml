name: Deploy Pádua no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # BAIXAR O PROJETO
      # =====================================================
      - name: Baixar projeto
        uses: actions/checkout@v4


      # =====================================================
      # CONFIGURAR NODE.JS
      # =====================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # =====================================================
      # INSTALAR DEPENDÊNCIAS
      # =====================================================
      - name: Instalar dependências
        run: npm ci


      # =====================================================
      # GERAR PRISMA CLIENT
      # =====================================================
      # Necessário antes do build para que o TypeScript
      # reconheça PrismaClient.
      - name: Gerar Prisma Client
        run: npx prisma generate


      # =====================================================
      # COMPILAR NEXT.JS
      # =====================================================
      - name: Compilar Next.js
        run: npm run build


      # =====================================================
      # CONFIGURAR GITHUB PAGES
      # =====================================================
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5


      # =====================================================
      # ENVIAR ARQUIVOS GERADOS
      # =====================================================
      - name: Enviar site compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out


  # =========================================================
  # DEPLOY
  # =========================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      # =====================================================
      # PUBLICAR NO GITHUB PAGES
      # =====================================================
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4